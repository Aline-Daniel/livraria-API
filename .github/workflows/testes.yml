name: Testes da API Livraria

on:
  push:
    branches:
      - master
      - 'fix/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe JavaScript
        run: |
          node --check app.js
          node --check bin/www
          node --check controllers/livrosController.js
          node --check controllers/indexController.js
          node --check routes/index.js
          node --check config/database.js
          node --check middleware/writeAuth.js
          node --check test/writeAuth.test.js
          node --check test/mysql.integration.test.js
      - name: Executar testes unitários sem acessar o banco de dados
        run: npm test

  testar-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: somente-ci-mysql-temporario
          MYSQL_DATABASE: livraria_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: livraria_ci
      DB_USER: root
      DB_PASSWORD: somente-ci-mysql-temporario
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências conforme package-lock
        run: npm ci --no-audit --no-fund
      - name: Gerar chave aleatória exclusiva para esta execução
        shell: bash
        run: |
          CHAVE=$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex'))")
          echo "API_WRITE_KEY=$CHAVE" >> "$GITHUB_ENV"
      - name: Executar testes HTTP com MySQL temporário
        run: npm run test:integration
